# This file goes in the root of your project
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "test/**"
    - "example/**"
  errors:
    # Primary culprits based on your pana logs and file structure:
    unused_local_variable: warning
    file_names: warning

    # Standard rules highly likely to be contributing to the remaining 309 issues:
    non_constant_identifier_names: warning
    constant_identifier_names: warning
    unnecessary_library_name: warning
    unnecessary_import: warning

    # Remaining suppressed rules to highlight:
    avoid_print: warning
    prefer_interpolation_to_compose_strings: warning
    curly_braces_in_flow_control_structures: warning
    annotate_overrides: warning
    use_key_in_widget_constructors: warning
