name: flutter_ml
description: Bring native GPU-accelerated machine learning to Flutter. Train models, build transformers, and run local inference without Python or cloud APIs.
version: 3.1.0
repository: https://github.com/NoirsCodingCorner/flutter_ml
issue_tracker: https://github.com/NoirsCodingCorner/flutter_ml/issues
topics:
  - machine-learning
  - neural-network
  - gpu
  - ffi

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_ml
        pluginClass: FlutterMlPlugin
      linux:
        pluginClass: FlutterMlPlugin
      windows:
        pluginClass: FlutterMlPluginCApi